services:
  user-db:
    image: postgres:16
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users"]
      interval: 5s
      timeout: 5s
      retries: 5

  task-db:
    image: postgres:16
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - task_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 5

  payment-db:
    image: postgres:16
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - payment_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payments"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build: ./user-service
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@user-db:5432/users
    ports:
      - "8001:8000"
    depends_on:
      user-db:
        condition: service_healthy

  task-service:
    build: ./task-service
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@task-db:5432/tasks
      USER_SERVICE_URL: http://user-service:8000
    ports:
      - "8000:8000"
    depends_on:
      task-db:
        condition: service_healthy
      user-service:
        condition: service_started

  payment-service:
    build: ./payment-service
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@payment-db:5432/payments
    ports:
      - "8002:8002"
    depends_on:
      payment-db:
        condition: service_healthy

volumes:
  user_db_data:
  task_db_data:
  payment_db_data: